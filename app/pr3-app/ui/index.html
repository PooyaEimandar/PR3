<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- An app, not a web page: a pinch or double tap does not zoom it, which would leave
         it wider than the screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PR3</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Compiled from src/main.ts (npm run build). -->
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header>
      <h1>PR3</h1>
    </header>
    <section id="settings" aria-label="Settings" hidden>
      <div class="top">
        <button id="settings-close" type="button" class="icon" aria-label="Close settings" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h2>Settings</h2>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="models" class="secondary small">Models</button>
        <button type="button" role="tab" data-tab="voice" class="secondary small">Voice</button>
        <button type="button" role="tab" data-tab="memory" class="secondary small">Memory</button>
        <button type="button" role="tab" data-tab="devices" class="secondary small">Devices</button>
      </div>
      <div id="models" class="pane" role="tabpanel" hidden></div>
      <div id="voice" class="pane" role="tabpanel" hidden>
        <h2>Voice</h2>
        <p id="voice-unavailable" class="meta" hidden></p>
        <label id="voice-language" class="field" hidden>
          <span class="meta">Language of voice notes and spoken replies</span>
          <select aria-label="Voice language"></select>
        </label>
        <label id="speak-replies" class="toggle" hidden>
          <input type="checkbox" />
          <span>Speak replies</span>
        </label>
      </div>
      <div id="memory" class="pane" role="tabpanel" hidden></div>
      <div id="devices" class="pane" role="tabpanel" hidden></div>
    </section>
    <!-- Tasks: To Do, Doing and Done, swiped left and right; a task opens to its chat
         (docs Sec. 4.8). Shown in place of the conversation. -->
    <section id="tasks" aria-label="Tasks" hidden>
      <div id="task-list">
        <div class="page-names" role="tablist">
          <button type="button" role="tab" data-page="todo" class="secondary small">To Do</button>
          <button type="button" role="tab" data-page="doing" class="secondary small">Doing</button>
          <button type="button" role="tab" data-page="done" class="secondary small">Done</button>
        </div>
        <div class="pages">
          <div class="page" data-page="todo" role="tabpanel" aria-label="To Do"></div>
          <div class="page" data-page="doing" role="tabpanel" aria-label="Doing"></div>
          <div class="page" data-page="done" role="tabpanel" aria-label="Done"></div>
        </div>
      </div>
      <div id="task-detail" hidden></div>
    </section>
    <main id="log" aria-live="polite"></main>
    <form id="composer" autocomplete="off">
      <button id="settings-button" type="button" class="icon" aria-label="Settings" title="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58a6.9 6.9 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <button id="tasks-button" type="button" class="icon" aria-label="Tasks" title="Tasks" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11 2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z"/></svg>
      </button>
      <input id="text" type="text" placeholder="Message PR3" aria-label="Message" />
      <button id="talk" type="button" aria-label="Hold to talk" title="Hold to talk and let go to send, or tap to talk and tap again to send" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      </button>
      <button type="submit">Send</button>
    </form>
  </body>
</html>
