<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PR3</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>PR3</h1>
        <div class="actions">
          <button id="pause-button" type="button" class="secondary small" aria-pressed="true" hidden>Send on pause</button>
          <button id="speak-button" type="button" class="secondary small" aria-pressed="false" hidden>Speak replies</button>
          <button id="memory-button" type="button" class="secondary small">Memory</button>
          <button id="devices-button" type="button" class="secondary small">Devices</button>
        </div>
      </div>
      <p id="platform">starting…</p>
    </header>
    <section id="devices" hidden></section>
    <section id="memory" hidden></section>
    <main id="log" aria-live="polite"></main>
    <form id="composer" autocomplete="off">
      <label id="voice-language" class="language" title="Voice language" hidden>
        <span>Auto</span>
        <select aria-label="Voice language"></select>
      </label>
      <button id="talk" type="button" aria-label="Hold to talk" title="Hold to talk and let go to send, or tap to talk and tap again to send" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
      </button>
      <input id="text" type="text" placeholder="Message PR3" aria-label="Message" />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
