[package]
name = "pr3-core"
description = "Sans-I/O, no_std core of the PR3 runtime: a step() state machine the host drives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Conveniences only, never behavior (docs Sec. 3, Sec. 4.2).
std = ["serde/std", "serde_json/std"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The trusted side: SHA-256 for receipts and the audit chain, P-256 ECDSA to verify
# approvals (the curve Secure Enclave and Android Keystore sign with). Both no_std.
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
proptest = "1"
