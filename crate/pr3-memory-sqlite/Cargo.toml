[package]
name = "pr3-memory-sqlite"
description = "PR3 memory on SQLite: provenance, FTS5 search, migrations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pr3-memory = { workspace = true, features = ["std"] }
# SHA-256 for the chain of task events, as the audit log uses.
pr3-core.workspace = true
pr3-protocol = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
# 0.42 also updates SQLCipher's embedded SQLite (RUSTSEC-2026-0459).
rusqlite = { version = "0.42" }
getrandom = "0.3"
zeroize = "1"

# SQLCipher also supports unkeyed databases for synthetic tests/benchmarks. The app
# always calls open_encrypted; encryption never falls back to ordinary SQLite.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.42", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
