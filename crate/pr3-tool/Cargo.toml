[package]
name = "pr3-tool"
description = "Built-in tools for PR3: calculator, clock, memory, a sandbox mail connector and reading linked web pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pr3-core = { workspace = true, features = ["std"] }
pr3-memory = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
# Reading linked pages (web.rs). Both already ship in the app through Tauri.
dom_query = { version = "0.27", default-features = false }
url = "2"
