[package]
name = "pr3-vault"
description = "PR3's vault: holds the device's approval key and signs approval receipts, never handing out the key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pr3-core = { workspace = true, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
getrandom = "0.3"
serde_json = { workspace = true, features = ["std"] }

# Builds the Swift half (swift/) on Apple platforms; the same version Tauri uses. Only a
# Mac builds Swift, and Cargo matches this against the machine that builds, so Linux and
# Windows never compile it (its runtime's Swift symbols do not link there).
[target.'cfg(target_vendor = "apple")'.build-dependencies]
swift-rs = { version = "1.0.9", features = ["build"] }
