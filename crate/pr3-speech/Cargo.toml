[package]
name = "pr3-speech"
description = "PR3's on-device speech: push-to-talk speech-to-text and spoken replies through the platform's own engines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true, features = ["std"] }

# Builds the Swift half (swift/) on Apple platforms; the same version Tauri uses. Only a
# Mac builds Swift, and Cargo matches this against the machine that builds, so Linux and
# Windows never compile it (its runtime's Swift symbols do not link there).
[target.'cfg(target_vendor = "apple")'.build-dependencies]
swift-rs = { version = "1.0.9", features = ["build"] }
