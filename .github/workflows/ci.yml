# The gates of doc/14-build-and-quality.md that run on every pull request.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (banned, layers, traps, ledger, links, vectors, workloads, format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format at the version the sources are formatted with
        run: python3 -m pip install --user clang-format==22.1.8
      - run: tools/check-banned.sh
      - run: tools/check-layers.sh
      - run: tools/check-traps.sh
      - run: tools/check-ledger.sh
      - run: tools/check-links.sh
      - name: golden vectors regenerate unchanged
        run: python3 -I tools/gen-vectors/gen_vectors.py --check
      - name: benchmark workloads regenerate unchanged
        run: python3 -I tools/gen-workloads.py --check
      - name: clang-format
        run: |
          find src include test bench board -type f \( -name '*.c' -o -name '*.h' -o -name '*.cc' \) -print0 |
            xargs -0 clang-format --dry-run -Werror

  host:
    name: ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, cc: clang, cxx: clang++, preset: dev }
          - { os: macos-15, cc: clang, cxx: clang++, preset: asan }
          - { os: macos-15, cc: clang, cxx: clang++, preset: ubsan }
          - { os: macos-15, cc: clang, cxx: clang++, preset: release }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: dev }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: asan }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: release }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: asan }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: ubsan }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: msan }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: tsan }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: release }
          - { os: ubuntu-24.04-arm, cc: gcc, cxx: g++, preset: release }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - if: runner.os == 'macOS'
        run: brew install ninja
      - run: tools/fetch-third-party.sh
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  msvc:
    name: windows msvc compile and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch-third-party.sh ryu
        shell: bash
      - run: cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 -DPR3_BUILD_MLPERF=OFF
      - run: cmake --build build/msvc --config Release
      - run: ctest --test-dir build/msvc -C Release --output-on-failure

  analyze:
    name: clang-tidy and gcc -fanalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18 gcc-14
      - run: tools/fetch-third-party.sh ryu
      - run: CC=clang cmake --preset dev -DPR3_BUILD_MLPERF=OFF
      - name: clang-tidy
        run: |
          find src test/unit board bench/c -name '*.c' ! -path 'board/freestanding/*' -print0 |
            xargs -0 -n 1 clang-tidy-18 -p build/dev --quiet
      - name: gcc -fanalyzer
        run: |
          CC=gcc-14 cmake -S . -B build/analyzer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPR3_BUILD_MLPERF=OFF -DCMAKE_C_FLAGS=-fanalyzer
          cmake --build build/analyzer

  cross:
    name: cross ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [android-arm64, armv6m, rv32imc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld llvm
      - if: matrix.preset == 'android-arm64'
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: tools/fetch-third-party.sh ryu
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - if: matrix.preset != 'android-arm64'
        name: freestanding link symbols
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: fuzz (seed replay and 60 s per target)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld llvm
      - run: tools/fetch-third-party.sh ryu
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - run: ctest --test-dir build/fuzz -L fuzz --output-on-failure
      - run: tools/fuzz.sh json 60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/
