# Quality gates for every change (docs Sec. 12): the workspace built and tested on
# macOS, Linux and Windows, the app's TypeScript type-checked, formatting, lints, the
# no_std builds of the core crates, known-vulnerability checks, fuzzing and Miri.
# The app itself, for every platform, is built by app.yml.
# Real-model tests need multi-gigabyte models and stay manual (cargo test -- --ignored).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well: new advisories reach the audit, and Miri runs even in a quiet week.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Faster builds and smaller caches: no debug info, no incremental state.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  check:
    # The workspace on each desktop platform. Formatting, clippy's lints, the
    # trusted-side rule and the no_std builds do not depend on the platform, so macOS
    # runs them once; Linux and Windows build and test with compiler warnings as errors,
    # which catches code that only one platform compiles.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version rust-toolchain.toml pins, with only what this job needs: the file's
      # own install would add the iOS, Android, embedded and WebAssembly libraries too.
      - name: Pinned toolchain
        run: |
          stable="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$stable" --profile minimal --component clippy,rustfmt
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add --toolchain "$stable" thumbv7em-none-eabihf wasm32-unknown-unknown
          fi
          echo "RUSTUP_TOOLCHAIN=$stable" >> "$GITHUB_ENV"
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - if: runner.os == 'macOS'
        name: The trusted side does not depend on the agent side
        run: script/check-trusted-side.sh
      - if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
        env:
          RUSTFLAGS: ${{ runner.os != 'macOS' && '-D warnings' || '' }}
      - if: runner.os == 'macOS'
        name: no_std builds
        run: |
          cargo check -p pr3-core --no-default-features --target thumbv7em-none-eabihf
          cargo check -p pr3-core --no-default-features --target wasm32-unknown-unknown
          cargo check -p pr3-memory --no-default-features --target thumbv7em-none-eabihf
          cargo check -p pr3-protocol --no-default-features --target thumbv7em-none-eabihf
          cargo check -p pr3-protocol --no-default-features --target wasm32-unknown-unknown

  ui:
    # The app's webview script (app/pr3-app/src), type-checked in strict mode.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/pr3-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/pr3-app/package-lock.json
      - run: npm ci
      - run: npm run check

  audit:
    runs-on: ubuntu-latest
    env:
      # The runner's own toolchain is enough to read Cargo.lock.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  miri:
    # Undefined behaviour in the core and the code it calls (docs Sec. 12), on the
    # nightly pinned in fuzz/rust-toolchain.toml. Property tests run few cases: Miri
    # interprets every instruction, and the job takes about an hour, so it runs on
    # pushes to main and weekly, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned nightly with Miri
        run: |
          nightly="$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
      - run: cargo "+$NIGHTLY" miri test -p pr3-core
        env:
          PROPTEST_CASES: "4"
          # Proptest reads the working directory to keep failing cases.
          MIRIFLAGS: "-Zmiri-disable-isolation"

  fuzz:
    # A minute on each parser of untrusted input (script/fuzz.sh). A failing input fails
    # the job and is kept as an artifact, to reproduce with cargo fuzz run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned nightly
        run: |
          nightly="$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)"
          rustup toolchain install "$nightly" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: script/fuzz.sh 60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifact
          path: fuzz/artifact
