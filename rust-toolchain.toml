# The toolchain PR3 is built and tested with (Roadmap §12). Bump deliberately, with a
# full run on every target.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "thumbv7em-none-eabihf",
    "wasm32-unknown-unknown",
]
