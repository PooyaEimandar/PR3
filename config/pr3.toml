# PR3 configuration, built into the app. To change it without rebuilding, put an edited
# copy named pr3.toml in the app's data folder (on macOS:
# ~/Library/Application Support/ai.pooya.pr3/pr3.toml). The PR3_MODEL environment
# variable, a path to a .gguf file, overrides the model choice below.

# Which model each kind of device runs. Values are ids from [models] below.
[model]
desktop = "qwen3.8-27b"
# Computers with less memory than this run `desktop_small` instead of `desktop`.
desktop_small = "qwen3.5-4b"
desktop_min_memory_gb = 30
mobile = "qwen3.5-4b"
# Phones with less memory than this run `mobile_small` instead of `mobile`.
mobile_small = "qwen3.5-2b"
mobile_min_memory_gb = 7

# OpenJarvis-format traces of every turn, for benchmarks and analysis. Off by default:
# they hold whole conversations in plain text, and forgetting a memory does not remove
# it from them. The file rotates at max_mb, keeping one older file.
[traces]
enabled = false
max_mb = 8

# Consequential actions (docs Sec. 4.6). The spike has one: sending email through a
# sandbox connector that delivers to outbox.jsonl in the app's data folder, never to
# the internet. Every email waits for the user's approval on a confirmation card.
[actions]
# The kill switch: false refuses every consequential action.
enabled = true
max_recipients = 3
max_per_day = 20
approval_seconds = 120

# The sandbox address book: the only people PR3 can email. The model names them; the
# addresses come only from here.
[[actions.contacts]]
name = "Alex Rivera"
address = "alex@example.com"

[[actions.contacts]]
name = "Sam Chen"
address = "sam@example.com"

# The private hybrid (docs Sec. 6.3): a computer lends its model to the phones paired with
# it; a paired phone uses it, and answers on its own when it cannot reach it. Only
# generation crosses: memory, tools and approvals stay on the phone.
[node]
# On a computer: accept paired phones. Phones ignore this section.
serve = true
# 127.0.0.1 reaches only this computer: the iOS simulator, and the Android emulator as
# 10.0.2.2. For a phone on your network use "0.0.0.0:7313"; macOS then asks whether PR3
# may accept incoming connections.
listen = "127.0.0.1:7313"

# The models PR3 knows, each pinned to a repository revision and SHA-256 so a download
# is exactly the file that was tested. scripts/fetch-model.sh downloads them into models/.

# Desktop: the strongest open model that runs locally. Needs a Mac with 32 GB or more.
[models."qwen3.8-27b"]
repo = "ggml-org/Qwen3.8-27B-GGUF"
revision = "a316ea527fde32c12487be7574e2db5ac2ad2a7e"
file = "Qwen3.8-27B-Q4_K_M.gguf"
