# Smoke settings for pr3_mlperf: runs of a few seconds that still reach a VALID result,
# for CI and for checking the harness. Never used for a reported result
# (doc/15-benchmarks.md#mlperf-inference).
#
# llama3_1-8b-edge sets sample_concatenate_permutation, which rounds the query count up
# to a multiple of the performance sample count. LoadGen takes that count from the
# override below and, for SingleStream, from the QSL too, so smoke runs also pass
# --performance 256 to pr3_mlperf.
*.*.performance_sample_count_override = 256
*.SingleStream.target_latency = 3
*.SingleStream.min_duration = 2000
*.SingleStream.min_query_count = 256
*.Offline.target_qps = 500
*.Offline.min_duration = 2000
*.Offline.min_query_count = 512
