# Development regression corpus for category-aware multilingual email exclusions.
# Frozen before inference; synthetic contacts/details; no external delivery.
filler = []

[[contact]]
name = "Alex Rivera"
address = "alex@example.com"

[[case]]
id = "semantic-email/en-finance"
kind = "approval"
launches = [
  [
    { say = "Prepare an email later to Alex Rivera about my pickup. Public reference PUB-391. My salary is 74200 USD; my bank account is ACCT-648. Wait before drafting.", card = "none" },
    { say = "Leave out anything about my finances from the email.", card = "none", expect = ["No email was prepared or sent"] },
  ],
  [
    { say = "Prepare the pickup email to Alex now with only the public reference.", card = "approve", card_contains = ["alex@example.com", "PUB-391"], card_excludes = ["74200", "ACCT-648"], to_exact = ["alex@example.com"], sent = ["PUB-391"], unsent = ["74200", "ACCT-648"] },
  ],
]

