# Long enough to come in two parts, with the ferry's time in the second.
[[page]]
url = "https://guide.example/park"
html = """<html><head><title>Visiting Hollin Water Park</title></head><body><main>
<h1>Visiting Hollin Water Park</h1>
<p>Hollin Water Park covers forty square kilometres of lakes, birch woods and low hills
on the eastern shore of Lake Hollin. It is open every day of the year from dawn to dusk,
and entry is free, though parking at the main gate costs six euros a day. The visitor
centre by the main gate has maps, a small cafe, toilets and a first-aid post, and its
staff can tell you which trails are open after heavy rain.</p>
<h2>Getting there</h2>
<p>Buses run from the town of Arnsby to the main gate every hour between seven in the
morning and eight in the evening, and the journey takes about forty minutes. Drivers
should follow the signs for the lake road from the Arnsby ring road; the car park fills
up by ten on summer weekends, so arrive early or take the bus. Cyclists can use the old
railway path, which runs flat and traffic-free for eighteen kilometres from Arnsby
station to the park's southern entrance.</p>
<h2>Trails</h2>
<p>The Shore Trail is an easy six-kilometre loop along the water from the visitor
centre, with benches every few hundred metres and a bird hide at the reed beds. It is
suitable for pushchairs and wheelchairs for most of its length, apart from a short
gravel section near the boathouse that can be muddy in spring.</p>
<p>The Birch Ridge Trail climbs gently through the woods to a viewpoint over the whole
lake. It is eleven kilometres there and back, and most walkers take three to four hours.
Good shoes are needed, as roots cross the path in many places, and the upper section is
closed in high winds.</p>
<p>The Long Water Trail is the park's hardest walk: twenty-two kilometres around the
northern arm of the lake, with two steep climbs and no shelter for long stretches. Only
start it before ten in the morning, carry water, and tell the visitor centre you are
going.</p>
<h2>Wildlife</h2>
<p>The reed beds are home to bitterns and marsh harriers, and otters are often seen at
dusk near the boathouse. In autumn, thousands of geese arrive from the north and roost
on the lake overnight. Please keep dogs on a lead between March and July, when birds
nest on the ground, and do not feed the swans, whatever they tell you.</p>
<h2>Boats and swimming</h2>
<p>Rowing boats and canoes can be hired at the boathouse from April to October, by the
hour or for a whole day, with life jackets included. Swimming is allowed only at the
marked beach by the visitor centre, where lifeguards are on duty on summer afternoons;
the rest of the lake is deep and cold even in August.</p>
<h2>Food and picnics</h2>
<p>The visitor centre cafe serves soup, sandwiches and cakes from nine until five, and
the boathouse kiosk sells ice cream and hot drinks in summer. Picnic tables stand at the
beach, at the Birch Ridge viewpoint and in the meadow behind the boathouse. Barbecues
and open fires are not allowed anywhere in the park, because the birch woods catch fire
easily in a dry summer; please take your rubbish home with you.</p>
<h2>Camping</h2>
<p>The small campsite at Fern Bay, two kilometres north of the visitor centre, has
thirty pitches for tents and campervans, with showers, a washing-up area and a shop
that opens in the mornings. Pitches must be booked in advance from May to September,
and the gate is locked at ten in the evening. Wild camping elsewhere in the park is not
allowed.</p>
<h2>Seasons</h2>
<p>Spring brings bluebells to the birch woods and the first swallows over the water. In
summer the park is busiest, and the beach and boathouse are crowded at weekends. Autumn
is the best time to see the geese and the colours on Birch Ridge, and in winter the
lake sometimes freezes at the edges, though walking on the ice is never safe.</p>
<h2>The ferry to Heron Island</h2>
<p>A small passenger ferry crosses from the boathouse jetty to Heron Island every half
hour from ten in the morning. The crossing takes twelve minutes, and the island has a
short nature trail, a picnic meadow and the ruins of a medieval chapel. Tickets are sold
on board and cost four euros return. The last ferry back from Heron Island leaves at
16:40, and there is no other way off the island, so keep an eye on the time.</p>
</main></body></html>"""

