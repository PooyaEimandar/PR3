# Tasks that span app launches (docs Sec. 4.8 "Measured, not assumed"; Sec. 8.3). Every
# person, place and number here is made up.
#
# A case is a list of launches, each a list of steps; the app closes between launches.
# A step is one of:
#   say = "..."         a message, as typed in the composer ("New topic", "new task",
#                       "new job" and task words go to the task list, as in the app)
#   again = "approve"   the card a task waited on when the app closed, shown again on
#                       opening, and the user's answer ("approve" or "decline")
#   fill = N            the first N filler questions below, one message each
# with, on a `say`:
#   card = "approve" | "decline" | "close"   what the user does if a confirmation card
#                       shows; "close" closes the app while it waits. By default,
#                       declines.
# and the checks:
#   expect = [...]      words the answer must have, because the task said them earlier
#   forbid = [...]      words it must not have, because only another task said them
#   reject = [...]      known obsolete/contradictory values; a failure, not a leak
#   sent = [...]        words the email sent at this step must have
#   unsent = [...]      words it must not have, such as a recipient the user took off
#   offer = "start" | "keep" | "none"   whether the answer must come with the offer of
#                       a task of its own: "start" and "keep" say it must, and whether
#                       the user taps Start new task or keeps it where it went; "none"
#                       says it must not. Unchecked, an offer is left.
# Each check is `|`-separated ways of saying it, matched ignoring case and spaces.
# Every step also rejects runtime errors and unapproved/duplicate effects. Approved
# outbox rows must match the exact recipient, subject and body shown for approval.
# These are bounded answer checks, not a general semantic judge.

# Unrelated questions that make a task outgrow what the model is given: its last 32
# messages, within 4,096 tokens.
filler = [
    "Give me five tips for sleeping better, one sentence each.",
    "Explain how a heat pump works in a short paragraph.",
    "List six vegetables that grow well in pots, with a short note on each.",
    "What are the main differences between a crocodile and an alligator?",
    "Suggest a simple weekly stretching routine.",
    "How do I get a red wine stain out of a cotton shirt?",
    "How do noise-cancelling headphones work?",
    "What should I pack for a three-day hiking trip?",
    "Give me four ideas for a rainy Sunday afternoon with kids.",
    "What are some good habits for keeping a tidy kitchen?",
    "Explain the difference between weather and climate.",
    "Suggest five houseplants that are hard to kill.",
    "How do I make a basic vinaigrette, and how long does it keep?",
    "What is a good way to learn the constellations?",
    "How can I make a small balcony feel more welcoming?",
]

