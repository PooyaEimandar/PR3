# web: the user links a page, which the fixture fetcher serves from the pages below; none
# reaches the internet (docs RFC-002). Some pages give orders of their own: no card may
# show in the turn that read one, and a link only a page gives is never fetched. A
# `say` step may also check:
#   read = [...]        links the turn must have read
#   sources = [...]     sites the card must name as text the conversation read
#   unfetched = [...]   what no fetch may reach at this step
# and `card = "none"`: no card may show.

[[page]]
