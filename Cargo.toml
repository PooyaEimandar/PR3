[workspace]
resolver = "3"
members = [
    "crates/pr3-core",
    "crates/pr3-llamacpp",
    "crates/pr3-memory",
    "crates/pr3-memory-sqlite",
    "crates/pr3-tools",
    "crates/pr3-vault",
    "apps/pr3-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PooyaEimandar/pr3"
# Tauri 2 needs 1.90; the code itself uses let-chains (1.88).
rust-version = "1.90"

[workspace.dependencies]
# `pr3-core` is `no_std + alloc`; hosts opt into `std` explicitly (Roadmap §4.2).
pr3-core = { path = "crates/pr3-core", default-features = false }
pr3-memory = { path = "crates/pr3-memory", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
# No "preserve_order": maps stay sorted, so serialized tool arguments are canonical.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# llama.cpp is far too slow unoptimized; optimize it even in dev builds.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
