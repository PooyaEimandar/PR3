[workspace]
resolver = "3"
members = [
    "crate/pr3-core",
    "crate/pr3-hybrid",
    "crate/pr3-llamacpp",
    "crate/pr3-memory",
    "crate/pr3-memory-sqlite",
    "crate/pr3-protocol",
    "crate/pr3-speech",
    "crate/pr3-tool",
    "crate/pr3-vault",
    "app/pr3-app/src-tauri",
    "bench/agentdojo/bridge",
    "bench/task",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PooyaEimandar/pr3"
# Tauri 2 needs 1.90; the code itself uses let-chains (1.88).
rust-version = "1.90"

[workspace.dependencies]
# `pr3-core` is `no_std + alloc`; hosts opt into `std` explicitly (docs Sec. 4.2).
pr3-core = { path = "crate/pr3-core", default-features = false }
pr3-memory = { path = "crate/pr3-memory", default-features = false }
pr3-protocol = { path = "crate/pr3-protocol", default-features = false }
serde = { version = "1", default-features = false, features = [
    "alloc",
    "derive",
] }
# No "preserve_order": maps stay sorted, so serialized tool arguments are canonical.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

# llama.cpp is far too slow unoptimized; optimize it even in dev builds.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
